<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ranking de anime por temporada</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    background-attachment: fixed;
    color:#fff;
    text-align:center;
    margin:0;
    padding:20px;
}
h1 {
    color: #fff;
    font-size:2.6em;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    margin-bottom: 10px;
    font-weight: 800;
    letter-spacing: -1px;
}
.controls { margin:30px auto; }
select, button {
    padding:12px;
    font-size:1.05em;
    margin:10px;
    border-radius:8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
    color:#fff;
    transition: all 0.3s ease;
}
select:focus {
    background: rgba(0,0,0,0.6);
    border-color: #ff4444;
    outline: none;
}
button {
    cursor:pointer;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    border: none;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
}
button:hover { transform:translateY(-2px); box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6); }
.grid {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:25px;
    max-width:1400px;
    margin:40px auto;
    padding: 30px;
    box-sizing: border-box;
}
.anime-card {
    position: relative;
    background: rgba(30, 30, 30, 0.6);
    backdrop-filter: blur(10px);
    border-radius:15px;
    padding:15px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition:.3s;

    display: flex;
    flex-direction: column;
    animation: fadeUp .4s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.anime-card:hover {
    transform: translateY(-10px);
    background: rgba(40, 40, 40, 0.8);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.anime-card img {
    width:100%;
    border-radius:12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    height: 300px;
    object-fit: cover;
    margin-bottom: 10px;
}
.rank {
    font-size: 1.5em;
    font-weight: 800;
    position: absolute;
    top: -10px;
    left: -10px;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #333;
    border: 3px solid #222;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    z-index: 10;
}
.rank.gold {
    background: linear-gradient(135deg, #FFD700, #FDB931);
    color: #000;
    text-shadow: none;
    border-color: #B8860B;
}

.rank.silver {
    background: linear-gradient(135deg, #E0E0E0, #BDBDBD);
    color: #000;
    text-shadow: none;
    border-color: #757575;
}

.rank.bronze {
    background: linear-gradient(135deg, #CD7F32, #A0522D);
    color: #fff;
    text-shadow: none;
    border-color: #8B4513;
}

.rank.red { background: #ff4444; color: white; }
.title {
    font-weight: bold;
    font-size: 1.05em;
    margin: 5px 0;

    line-height: 1.2em;

    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;   /* 🔥 máximo 5 líneas */

    overflow: hidden;

    min-height: 6em;        /* 🔥 5 líneas × 1.2em */
}
.scores {
    font-size: 0.85em;
    color: #aaa;
    margin: 3x 0;

    min-height: 2.4em; /* 🔥 clave */
}

.average {
    font-size:1.6em;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    margin-bottom: 14px; /* espacio hacia los links */
    font-weight: 800;
}
.links a {
    color: #ff8888;
    margin:0 8px;
    text-decoration:none;
    font-weight: 600;
    transition: color 0.2s;
}
.links a:hover { color: #fff; text-decoration:none; }

/* Tipo y episodios */
.anime-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 4px 0 6px;
    justify-content: center;
}
.badge {
    font-size: 0.72em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.03em;
}
.badge-type {
    background: rgba(255, 65, 108, 0.25);
    border: 1px solid rgba(255, 65, 108, 0.5);
    color: #ff9999;
}
.badge-eps {
    background: rgba(100, 180, 255, 0.15);
    border: 1px solid rgba(100, 180, 255, 0.35);
    color: #99ccff;
}

/* Búsqueda */
.search-bar {
    display: none;
    margin: 10px auto 0;
    max-width: 500px;
    position: relative;
}
.search-bar.visible {
    display: block;
}
.search-bar input {
    width: 100%;
    padding: 10px 40px 10px 16px;
    font-size: 1em;
    font-family: 'Poppins', sans-serif;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
}
.search-bar input:focus {
    border-color: #ff4444;
}
.search-bar input::placeholder { color: #888; }
.search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #888;
    font-size: 1.1em;
    display: none;
    background: none;
    border: none;
    padding: 0;
    line-height: 1;
    box-shadow: none;
}
.search-clear:hover { color: #fff; transform: translateY(-50%); box-shadow: none; }
.search-no-results {
    color: #aaa;
    font-size: 1.1em;
    margin: 40px auto;
    display: none;
}

/* Edición manual */
.al-score {
    cursor: pointer;
    color: #ff6666;
    font-weight: bold;
}
.al-score:hover {
    text-decoration: underline;
}
.edit-input {
    width: 60px;
    padding: 4px;
    background: #222;
    color: #fff;
    border: 1px solid #cc0000;
    border-radius: 4px;
    text-align: center;
}

/* Barra de progreso */
.progress-container {
    width: 60%;
    max-width: 800px;
    margin: 30px auto;
    background: rgba(0,0,0,0.4);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    display: none;
}
.progress-bar {
    width: 0%;
    height: 30px;
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    border-radius: 20px;
    transition: width 0.4s ease;
    position: relative;
}
.progress-text {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 30px;
    font-weight: bold;
    color: white;
    text-shadow: 1px 1px 3px black;
}

.skeleton {
    background: rgba(255,255,255,0.05);
    border-radius:15px;
    padding:15px;
    box-shadow: none;

    height: 520px; /* 🔥 mismo alto que una card real */

    background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    background-size: 200% 100%;
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0% { background-position:0% }
    100% { background-position:200% }
}
/* Contenedor que permite el swipe */
.grid-container {
    display: flex;
    transition: transform 0.4s ease;
    width: 100%;
}

.grid-wrapper {
    overflow: hidden;
    max-width: 1400px;
    margin: 0 auto;
    touch-action: pan-y;
    padding: 15px;
    box-sizing: border-box;
}

/* La grilla empieza completamente oculta */
#grid {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s; /* evita el "pop" al aparecer */
}

/* Cuando ya esté lista la mostramos con fade-in */
#grid.loaded {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s ease, visibility 0s linear 0s;
}

/* En desktop: botones visibles, swipe desactivado */
@media (min-width: 769px) {
    .grid-container {
        transform: none !important; /* no swipe en desktop */
    }
}

/* En móvil: preparamos para swipe horizontal */
@media (max-width: 768px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        width: 100%;
        margin: 0;
    }

    .anime-card img {
        height: 210px;
    }

    .title {
        font-size: 1em;
        -webkit-line-clamp: 3;
        min-height: 3.9em;
    }

    .average {
        font-size: 1.3em;
    }

    /* Ocultar botones de paginación en móvil */
    .pagination-buttons {
        display: none !important;
    }

    /* Swipe más suave */
    .grid-container {
        touch-action: pan-y;
    }
}
/* Desktop grande (más de 1024px) - ya tenés 5 columnas, lo dejamos como está */
</style>
</head>
<body>
<h1>Ranking de anime por temporada</h1>
<div id="updateInfo" style="margin: 15px auto; font-size: 1.1em; color: #ff9999; min-height: 1.5em;">
    Próxima actualización en: <span id="countdown">--:--:--</span>
</div>
<div id="loading" class="loading">Seleccioná temporada y año</div>
<div class="controls">
    <select id="year"></select>
    <select id="season">
        <option value="winter">Winter</option>
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
        <option value="fall">Fall</option>
    </select>

    <!-- Checkboxes + dropdown juntos -->
    <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px; margin: 15px auto;">
        <div class="type-filters" style="font-size: 1.1em; display: flex; flex-wrap: wrap; gap: 15px; align-items: center;">
            <label><input type="checkbox" id="type-tv" checked> TV</label>
            <label><input type="checkbox" id="type-ona" checked> ONA</label>
            <label><input type="checkbox" id="type-movie" checked> Movie</label>
            <label><input type="checkbox" id="type-ova" checked> OVA</label>
            <label><input type="checkbox" id="type-special" checked> Special</label>
        </div>

        <!-- Dropdown al lado -->
        <div style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
            <label for="scoreMode" style="font-size: 1.1em;">Mostrar puntajes como:</label>
            <select id="scoreMode">
                <option value="normal">Del 1 al 10</option>
                <option value="percent">Porcentual</option>
            </select>
        </div>
    </div>

    <div style="display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
        <button onclick="loadTop10()">Buscar</button>
        <button id="prevPageBtn" onclick="prevPage()" style="background: linear-gradient(45deg, #2c3e50, #4ca1af);">
        ← Anterior
    </button>
    <button id="nextPageBtn" onclick="nextPage()" style="background: linear-gradient(45deg, #2c3e50, #4ca1af);">
        Siguiente →
    </button>
    </div>
</div>

<!-- Contenedor de estadísticas -->
<div id="statsContainer" style="margin: 20px auto; font-size: 1.1em; color: #ccc; min-height: 1.5em; display: none; background: rgba(0,0,0,0.2); padding: 14px 20px; border-radius: 8px; max-width: 700px; box-sizing: border-box; line-height: 2em;">
    Promedio Top 10: <span id="top10Avg" style="font-weight: bold; color: #FFD700;">--</span> &nbsp;|&nbsp;
    Promedio Total (<span id="totalCount" style="font-weight: bold;">0</span> animes): <span id="totalAvg" style="font-weight: bold; color: #fff;">--</span>
    <br>
    <label style="color: #ccc; font-size: 0.95em;">
        Promedio Top&nbsp;
        <input id="topNInput" type="number" min="1" value="10"
            style="width:60px; padding:4px 6px; font-size:1em; background:#222; color:#fff;
                   border:1px solid #555; border-radius:6px; text-align:center;"
            oninput="updateTopN()">
        &nbsp;animes:&nbsp;<span id="topNAvg" style="font-weight: bold; color: #ff9966;">--</span>
        <span id="topNNote" style="font-size:0.8em; color:#888; margin-left:6px;"></span>
    </label>
</div>


<!-- Búsqueda por nombre -->
<div id="searchBar" class="search-bar">
    <input type="text" id="searchInput" placeholder="Filtrar por nombre…" oninput="applySearch()" autocomplete="off">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
</div>
<div id="searchNoResults" class="search-no-results">No se encontraron animes con ese nombre.</div>

<div id="progressContainer" class="progress-container">
    <div id="progressBar" class="progress-bar">
        <div id="progressText" class="progress-text">0%</div>
    </div>
</div>


<!-- Navegación sobre el grid -->
<div id="gridWrapper" class="grid-wrapper">
    <div id="gridContainer" class="grid-container" style="display: flex; transition: transform 0.4s ease; width: 100%;">
        <div id="grid" class="grid"></div>
    </div>
</div>


<script>
const CACHE_TTL = 4 * 60 * 60 * 1000;     // 4 horas
const MAX_SEASONS_CACHED = 25;
const BATCH_SIZE = 15;

const grid = document.getElementById('grid');
const loading = document.getElementById('loading');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
let seasonRanking = []; // Lista completa de la temporada
let currentPage = 1;
const itemsPerPage = 10;
let isLoading = false;
let currentLoadPromise = null; // Para poder abortar/cancelar


window.onload = () => {
    const y = document.getElementById('year');
    
    // Llenar el select de años (ejemplo: últimos 20 años + el actual + próximo)
    const currentYear = new Date().getFullYear();
    for (let i = currentYear + 1; i >= currentYear - 20; i--) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        y.appendChild(opt);
    }
    // Seleccionar el año actual por defecto
    y.value = currentYear;

    // Restaurar temporada seleccionada si existe
    const savedSeason = localStorage.getItem('selectedSeason');
    if (savedSeason) {
        document.getElementById('season').value = savedSeason;
    }

    // ────────────────────────────────────────────────
    // Restaurar modo de puntaje
    // ────────────────────────────────────────────────
    const savedScoreMode = localStorage.getItem('scoreMode') || 'normal';
    const scoreModeSelect = document.getElementById('scoreMode');
    if (scoreModeSelect) {
        scoreModeSelect.value = savedScoreMode;
        currentScoreMode = savedScoreMode;
    }

    // ────────────────────────────────────────────────
    // Restaurar tipos seleccionados (checkboxes)
    // ────────────────────────────────────────────────
    const savedTypes = JSON.parse(localStorage.getItem('selectedTypes') || '[]');

    // Si NO hay nada guardado en localStorage → tildamos TODOS por defecto
    if (savedTypes.length === 0) {
        document.getElementById('type-tv').checked     = true;
        document.getElementById('type-ona').checked    = true;
        document.getElementById('type-movie').checked  = true;
        document.getElementById('type-ova').checked    = true;
        document.getElementById('type-special').checked = true;
    } else {
        // Restauramos exactamente lo que el usuario guardó
        document.getElementById('type-tv').checked     = savedTypes.includes("TV");
        document.getElementById('type-ona').checked    = savedTypes.includes("ONA");
        document.getElementById('type-movie').checked  = savedTypes.includes("Movie");
        document.getElementById('type-ova').checked    = savedTypes.includes("OVA");
        document.getElementById('type-special').checked = savedTypes.includes("Special");
    }

    // ────────────────────────────────────────────────
    // Guardar cambios en checkboxes cuando el usuario los modifique
    // ────────────────────────────────────────────────
    const checkboxes = [
        'type-tv', 'type-ona', 'type-movie', 'type-ova', 'type-special'
    ];
    checkboxes.forEach(id => {
        const checkbox = document.getElementById(id);
        if (checkbox) {
            checkbox.addEventListener('change', () => {
                const selected = getSelectedTypes();
                localStorage.setItem('selectedTypes', JSON.stringify(selected));
            });
        }
    });

    // ────────────────────────────────────────────────
    // Guardar temporada cuando cambie el select
    // ────────────────────────────────────────────────
    document.getElementById('season').addEventListener('change', function() {
        localStorage.setItem('selectedSeason', this.value);
    });

    // Iniciar countdown (si ya hay temporada y año seleccionados)
    startCountdown();

    // Opcional: si querés cargar automáticamente la temporada actual al abrir la página,
    // podés descomentar esto (pero como pediste que NO cargue automáticamente, lo dejo comentado)
    // loadTop10();
};

const delay = ms => new Promise(r => setTimeout(r, ms));

function seasonKey(year, season) { return `SEASON_${year}_${season}`; }

function getSeasonCache(key) {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.timestamp > CACHE_TTL) {
        localStorage.removeItem(key);
        return null;
    }
    parsed.lastUsed = Date.now();
    localStorage.setItem(key, JSON.stringify(parsed));
    return parsed.data;
}

function saveSeasonCache(key, data) {
    localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), lastUsed: Date.now(), data }));
    cleanupCache();
}

function cleanupCache() {
    const seasons = Object.keys(localStorage)
        .filter(k => k.startsWith('SEASON_'))
        .map(k => ({ key: k, ...JSON.parse(localStorage.getItem(k)) }));
    if (seasons.length <= MAX_SEASONS_CACHED) return;
    seasons.sort((a, b) => a.lastUsed - b.lastUsed)
        .slice(0, seasons.length - MAX_SEASONS_CACHED)
        .forEach(s => localStorage.removeItem(s.key));
}

// Consulta rápida a AniList por un solo MAL ID (ponela ANTES de fetchSeasonMAL)
async function getAniListSeason(malId) {
    const query = `
    query ($idMal: Int) {
      Media(idMal: $idMal, type: ANIME) {
        season
        seasonYear
        startDate {
          year
          month
          day
        }
      }
    }`;

    try {
        const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables: { idMal: malId } })
        });

        if (!res.ok) return null;

        const data = await res.json();
        const media = data.data?.Media;

        if (!media) return null;

        return {
            season: media.season,
            seasonYear: media.seasonYear,
            startYear: media.startDate?.year
        };
    } catch (e) {
        console.error('Error fetching AniList season for MAL ID', malId, e);
        return null;
    }
}

async function fetchSeasonFromAniList(year, season) {
    const allowedFormats = getSelectedTypes().map(t => {
        switch (t) {
            case "TV": return "TV";
            case "ONA": return "ONA";
            case "Movie": return "MOVIE";
            case "OVA": return "OVA";
            case "Special": return "SPECIAL";
            default: return null;
        }
    }).filter(Boolean);

    if (allowedFormats.length === 0) return [];

    const aniSeason = season.toUpperCase(); // WINTER, SPRING, SUMMER, FALL

    const query = `
query ($seasonYear: Int, $season: MediaSeason, $formats: [MediaFormat], $page: Int) {
  Page(page: $page, perPage: 50) {
    pageInfo { hasNextPage }
    media(seasonYear: $seasonYear, season: $season, format_in: $formats, type: ANIME, sort: SCORE_DESC) {
      id
      idMal
      title { 
        english 
        romaji 
        native   # ← AGREGAR ESTO
      }
      averageScore
      format
      episodes
      coverImage { large }
    }
  }
}`;

    let allMedia = [];
    let page = 1;
    let hasNext = true;

    while (hasNext && allMedia.length < 60) {
        try {
            const res = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query,
                    variables: { seasonYear: year, season: aniSeason, formats: allowedFormats, page }
                })
            });

            if (!res.ok) break;

            const { data } = await res.json();
            const pageData = data?.Page;

            if (!pageData?.media) break;

            allMedia.push(...pageData.media);
            hasNext = pageData.pageInfo.hasNextPage;
            page++;
            await delay(400); // Rate limit AniList ~90/min, mejor ser conservador
        } catch (e) {
            console.error("Error fetching AniList season", e);
            break;
        }
    }

    // Ordenar por score descendente (aunque ya pedimos sort)
    allMedia.sort((a, b) => (b.averageScore || 0) - (a.averageScore || 0));

    // Mapear a formato compatible con tu código actual (para que renderCard y scores funcionen)
    return allMedia.map(m => ({
    mal_id: m.idMal || null,
    titles: {
        english: m.title?.english ?? null,
        romaji:  m.title?.romaji  ?? null,
        native:  m.title?.native  ?? null
    },
    image: m.coverImage?.large || '',
    score: m.averageScore ? (m.averageScore / 10) : null,
    format: m.format,
    episodes: m.episodes,
    al_id: m.id
}));

}


async function fetchAniListBatch(malIds) {
    const results = {};
    const missingIds = [];

    malIds.forEach(malId => {
        const cacheKey = `AL_MAL_${malId}`;
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
            results[malId] = JSON.parse(cached);
        } else {
            missingIds.push(malId);
        }
    });

    if (missingIds.length === 0) return results;

    const query = `
    query ($ids: [Int]) {
      Page {
        media(idMal_in: $ids, type: ANIME) {
          id
          idMal
          averageScore
        }
      }
    }`;

    const batches = [];
    for (let i = 0; i < missingIds.length; i += BATCH_SIZE) {
        batches.push(missingIds.slice(i, i + BATCH_SIZE));
    }

    for (const batch of batches) {
        const variables = { ids: batch };
        const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables })
        });
        if (!res.ok) continue;
        const data = await res.json();
        const mediaList = data.data.Page?.media || [];
        mediaList.forEach(media => {
            const result = {
                id: media.id,
                score: media.averageScore ? (media.averageScore / 10).toFixed(2) : null
            };
            const cacheKey = `AL_MAL_${media.idMal}`;
            localStorage.setItem(cacheKey, JSON.stringify(result));
            results[media.idMal] = result;
        });
        await delay(1000);
    }

    return results;
}


function getManualScore(malId) {

}

function saveManualScore(malId, score) {

}

function renderCard(anime, index) {
    const card = document.createElement('div');
    card.className = 'anime-card';
    const rankClass =
        index === 0 ? 'gold' :
        index === 1 ? 'silver' :
        index === 2 ? 'bronze' :
        'red';

    // Score AniList: automático, manual o N/A
    let alScore = anime.al;
    if (!alScore || alScore === 'N/A') {
        const manual = getManualScore(anime.mal_id);
        if (manual) alScore = manual;
    }
    const hasAlId = anime.al_id !== undefined;

    // Valores numéricos para cálculos y formateo
    const malVal = anime.mal !== 'N/A' && !isNaN(parseFloat(anime.mal)) ? parseFloat(anime.mal) : null;
    const alVal  = alScore && alScore !== 'N/A' && !isNaN(parseFloat(alScore)) ? parseFloat(alScore) : null;

    let avgNum = 0, sourcesCount = 0;
    if (malVal !== null) { avgNum += malVal; sourcesCount++; }
    if (alVal  !== null) { avgNum += alVal;  sourcesCount++; }
    const avgRaw = sourcesCount > 0 ? avgNum / sourcesCount : null;

    // Formateador respeta el modo actual (normal / porcentual)
    const format = (num) => {
        if (num === null || num === undefined) return 'N/A';
        return currentScoreMode === 'percent'
            ? (num * 10).toFixed(2) + '%'
            : num.toFixed(2);
    };

    // Badges de tipo y episodios
    const typeLabel = anime.type && anime.type !== 'Unknown' ? anime.type : null;
    const epsLabel  = anime.episodes ? `${anime.episodes} ep` : null;
    const metaHTML  = (typeLabel || epsLabel) ? `
        <div class="anime-meta">
            ${typeLabel ? `<span class="badge badge-type">${typeLabel}</span>` : ''}
            ${epsLabel  ? `<span class="badge badge-eps">${epsLabel}</span>`   : ''}
        </div>` : '';

    // Render del score AniList
    const alDisplay = alVal !== null
        ? `<span>${format(alVal)}</span>`
        : hasAlId
            ? `<span class="al-score" onclick="editAlScore(${anime.mal_id}, this)">N/A (editar)</span>`
            : `<span>N/A</span>`;

    card.innerHTML = `
        <div class="rank ${rankClass}">#${index + 1}</div>
        <img src="${anime.image}" loading="lazy">
        <div class="title">${anime.title}</div>
        ${metaHTML}
        <div class="scores">
            MAL: ${format(malVal)} | AniList: ${alDisplay}
        </div>
        <div class="bottom">
            <div class="average">&#11088; ${format(avgRaw)}</div>
            <div class="links">
                <a href="https://myanimelist.net/anime/${anime.mal_id}" target="_blank">MAL</a>
                ${hasAlId ? `<a href="https://anilist.co/anime/${anime.al_id}" target="_blank">AniList</a>` : ''}
            </div>
        </div>
    `;

    grid.appendChild(card);
}

// Función global para editar score
function editAlScore(malId, element) {
    const current = element.textContent.trim();
    const newText = current.includes('editar') ? '' : current;

    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.01';
    input.min = '0';
    input.max = '10';
    input.value = newText === 'N/A' || newText === '' ? '' : newText;
    input.className = 'edit-input';

    input.onblur = () => {
        let value = input.value.trim();
        if (value && parseFloat(value) >= 0 && parseFloat(value) <= 10) {
            value = parseFloat(value).toFixed(2);
            saveManualScore(malId, value);
            element.textContent = value;
        } else {
            element.textContent = 'N/A (editar)';
        }
        input.remove();
        // Recalcular todo el top con el nuevo promedio
        loadTop10(); // Recarga para reordenar si cambió el promedio
    };

    input.onkeydown = (e) => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
            element.textContent = 'N/A (editar)';
            input.remove();
        }
    };

    element.textContent = '';
    element.appendChild(input);
    input.focus();
}

function getMalCache(id) {
    const raw = localStorage.getItem(`MAL_FULL_${id}`);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.timestamp > CACHE_TTL) {
        localStorage.removeItem(`MAL_FULL_${id}`);
        return null;
    }
    return parsed.data;
}

function saveMalCache(id, data) {
    localStorage.setItem(`MAL_FULL_${id}`, JSON.stringify({
        timestamp: Date.now(),
        data
    }));
}

// Nueva función para buscar un solo anime si falla el bulk
async function fetchMalById(id) {
    try {
        const res = await fetch(`https://api.jikan.moe/v4/anime/${id}`);
        if (res.status === 429) {
            await delay(2000);
            return fetchMalById(id);
        }
        if (!res.ok) return null;
        const json = await res.json();
        return json.data;
    } catch (e) { return null; }
}

// Nueva función: Obtiene toda la temporada de Jikan en pocas peticiones (Bulk)
async function fetchJikanSeason(year, season) {
    const jikanSeason = season.toLowerCase();
    let page = 1;
    let hasNext = true;
    const results = {};
    
    while (hasNext && isLoading) {
        try {
            const res = await fetch(`https://api.jikan.moe/v4/seasons/${year}/${jikanSeason}?page=${page}`);
            if (res.status === 429 || res.status >= 500) {
                await delay(2000);
                continue;
            }
            if (!res.ok) break;

            const data = await res.json();
            (data.data || []).forEach(anime => {
                results[anime.mal_id] = anime;
                saveMalCache(anime.mal_id, anime);
            });

            hasNext = data.pagination?.has_next_page;
            page++;
            await delay(600); // Delay pequeño es suficiente para paginación
        } catch (e) {
            console.error("Jikan Season Error", e);
            break;
        }
    }
    return results;
}

                // Etapa 1: AniList → 0% a 30%
updateProgress(5, 'Consultando...');
const aniList = await fetchSeasonFromAniList(year, season);

updateProgress(32, `Filtrados ${candidates.length} animes con potencial score`);

});
                

                updateProgress(90, 'Calculando promedios...');

// Retorna milisegundos restantes hasta que expire el caché de esta temporada
function getTimeUntilNextUpdate(year, season) {
    if (!year || !season) return 0;
    
    const key = seasonKey(year, season);
    const raw = localStorage.getItem(key);
    if (!raw) return CACHE_TTL; // si no hay caché → como si acabara de empezar
    
    const parsed = JSON.parse(raw);
    const expiresAt = parsed.timestamp + CACHE_TTL;
    const remaining = expiresAt - Date.now();
    
    return Math.max(0, remaining);
}

// Formatea milisegundos a "Xh Ym Zs" o "menos de 1 minuto", etc.
function formatRemainingTime(ms) {
    if (ms <= 0) return "¡Ahora! (recarga para actualizar)";
    
    const seconds = Math.floor(ms / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours   = Math.floor(minutes / 60);
    
    const s = seconds % 60;
    const m = minutes % 60;
    const h = hours;
    
    if (h > 0) {
        return `${h}h ${m}m ${s}s`;
    } else if (m > 0) {
        return `${m}m ${s}s`;
    } else {
        return `${s}s`;
    }
}

// Inicia y actualiza el countdown cada segundo
let countdownInterval = null;

function startCountdown() {
    const year = document.getElementById('year')?.value;
    const season = document.getElementById('season')?.value;
    
    if (!year || !season) {
        document.getElementById('countdown').textContent = "—";
        return;
    }
    
    const updateCountdown = () => {
        const remainingMs = getTimeUntilNextUpdate(year, season);
        document.getElementById('countdown').textContent = formatRemainingTime(remainingMs);
        
        // Opcional: si llega a 0, podrías cambiar color o texto
        if (remainingMs <= 0) {
            document.getElementById('updateInfo').style.color = '#66ff66';
        }
    };
    
    updateCountdown(); // inmediato
    
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(updateCountdown, 1000);
}

// Calcula y muestra los promedios de puntajes
function updateStats() {
    const statsContainer = document.getElementById('statsContainer');
    const top10AvgEl = document.getElementById('top10Avg');
    const totalAvgEl = document.getElementById('totalAvg');
    const totalCountEl = document.getElementById('totalCount');

    if (!seasonRanking || seasonRanking.length === 0) {
        statsContainer.style.display = 'none';
        return;
    }

    // Calcular promedio del Top 10
    const top10 = seasonRanking.slice(0, 10);
    const top10Sum = top10.reduce((sum, anime) => sum + parseFloat(anime.avg), 0);
    const top10Average = top10.length > 0 ? (top10Sum / top10.length).toFixed(2) : 'N/A';

    // Calcular promedio total
    const totalSum = seasonRanking.reduce((sum, anime) => sum + parseFloat(anime.avg), 0);
    const totalAverage = seasonRanking.length > 0 ? (totalSum / seasonRanking.length).toFixed(2) : 'N/A';

    top10AvgEl.textContent = top10Average;
    totalAvgEl.textContent = totalAverage;
    totalCountEl.textContent = seasonRanking.length;
    statsContainer.style.display = 'block';

    // Inicializar el input topN respetando el total disponible
    const topNInput = document.getElementById('topNInput');
    if (topNInput) {
        topNInput.max = seasonRanking.length;
        // Si el valor actual excede el total, lo ajustamos
        if (parseInt(topNInput.value) > seasonRanking.length) {
            topNInput.value = seasonRanking.length;
        }
        updateTopN();
    }
}

// Calcula el promedio para el Top N elegido por el usuario
function updateTopN() {
    if (!seasonRanking || seasonRanking.length === 0) return;

    const topNInput = document.getElementById('topNInput');
    const topNAvgEl = document.getElementById('topNAvg');
    const topNNote  = document.getElementById('topNNote');

    let n = parseInt(topNInput.value);
    const total = seasonRanking.length;

    // Validar rango
    if (isNaN(n) || n < 1) {
        n = 1;
        topNInput.value = 1;
    }
    if (n > total) {
        n = total;
        topNInput.value = total;
        topNNote.textContent = `(máx. ${total} en esta temporada)`;
    } else {
        topNNote.textContent = '';
    }

    const slice = seasonRanking.slice(0, n);
    const sum = slice.reduce((acc, anime) => acc + parseFloat(anime.avg), 0);
    const avg = (sum / slice.length).toFixed(2);

    topNAvgEl.textContent = avg;
}

// Navegación con swipe (solo en móvil) y flechas del teclado
// ────────────────────────────────────────────────

let touchStartX = 0;
let touchEndX = 0;
const swipeThreshold = 50; // píxeles mínimos para considerar swipe

const gridWrapper = document.getElementById('gridWrapper');
const gridContainer = document.getElementById('gridContainer');

// Solo activamos swipe en pantallas pequeñas
if (window.innerWidth <= 768) {
    gridWrapper.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    });

    gridWrapper.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });
}

function handleSwipe() {
    if (touchStartX - touchEndX > swipeThreshold) {
        // Swipe izquierda → siguiente página
        nextPage();
    }
    if (touchEndX - touchStartX > swipeThreshold) {
        // Swipe derecha → página anterior
        prevPage();
    }
}

// Soporte para flechas del teclado (en desktop y móvil)
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') {
        prevPage();
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        nextPage();
        e.preventDefault();
    }
});

// Actualizamos la clase active para que el swipe funcione solo cuando hay más de una página
function updatePageButtons() {
    const total = getActiveRanking().length;
    document.getElementById('prevPageBtn').disabled = currentPage === 1;
    document.getElementById('nextPageBtn').disabled = currentPage * itemsPerPage >= total;

    // En móvil mostramos visualmente si hay más páginas (opcional)
    if (window.innerWidth <= 768) {
        gridWrapper.classList.toggle('has-prev', currentPage > 1);
        gridWrapper.classList.toggle('has-next', currentPage * itemsPerPage < total);
    }
