<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ranking de anime por temporada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://graphql.anilist.co">
<link rel="preconnect" href="https://api.jikan.moe">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0d13;
    --surface: #131722;
    --surface2: #1a1f2d;
    --surface3: #222839;
    --line: rgba(255,255,255,.08);
    --line2: rgba(255,255,255,.14);
    --text: #eef1f7;
    --muted: #a3acc0;
    --dim: #7c869e;
    --accent: #ff5c7a;
    --accent2: #7aa2ff;
    --gold: #ffd166;
    --ok: #5ee6a8;
    --warn: #ffb86b;
    --radius: 14px;
}
* { box-sizing: border-box; }
html { scrollbar-color: #2a3145 var(--bg); }
body {
    margin: 0;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg);
    background-image:
        radial-gradient(900px 520px at 8% -12%, rgba(255,92,122,.13), transparent 60%),
        radial-gradient(800px 520px at 100% -5%, rgba(122,162,255,.11), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}
button, select, input { font-family: inherit; color: inherit; }
select option { background: var(--surface2); color: var(--text); }
[hidden] { display: none !important; }

/* ── Header ── */
.topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11,13,19,.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
}
.topbar-inner {
    max-width: 1440px; margin: 0 auto;
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #ff9a5c);
    color: #fff; font-size: 1.1em; font-weight: 800;
    box-shadow: 0 6px 18px rgba(255,92,122,.35);
}
.brand h1 { margin: 0; font-size: 1.15em; font-weight: 700; letter-spacing: -.2px; }
.brand p { margin: 0; font-size: .75em; color: var(--muted); }

.season-picker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl {
    height: 36px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--line2);
    background: var(--surface2); color: var(--text);
    font-size: .92em; outline: none; transition: border-color .15s, background .15s;
}
.ctl:hover { border-color: rgba(255,255,255,.25); }
.ctl:focus-visible { border-color: var(--accent2); }
select.ctl { cursor: pointer; padding-right: 8px; }
.btn {
    height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line2);
    background: var(--surface2); color: var(--text); font-weight: 600; font-size: .92em;
    cursor: pointer; transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover:not(:disabled) { background: var(--surface3); border-color: rgba(255,255,255,.25); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary {
    background: linear-gradient(135deg, var(--accent), #ff7a5c); border: none; color: #fff;
    box-shadow: 0 4px 14px rgba(255,92,122,.35);
}
.btn.primary:hover:not(:disabled) { background: linear-gradient(135deg, #ff6d88, #ff8a6d); box-shadow: 0 6px 18px rgba(255,92,122,.5); }
.btn.icon { width: 36px; padding: 0; font-size: 1.15em; }
.btn.small { height: 28px; padding: 0 10px; font-size: .82em; border-radius: 8px; }

/* Progress */
.progress { height: 3px; background: transparent; overflow: hidden; }
.progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #ffb86b, var(--accent2));
    transition: width .35s ease, opacity .4s ease; opacity: 0;
}
.progress.active .progress-fill { opacity: 1; }

/* ── Toolbar ── */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px; }
.toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    margin-top: 16px;
}
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { position: relative; cursor: pointer; user-select: none; }
.pill input { position: absolute; opacity: 0; pointer-events: none; }
.pill span {
    display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
    border-radius: 999px; border: 1px solid var(--line2);
    background: var(--surface); color: var(--muted); font-size: .85em; font-weight: 500;
    transition: all .15s;
}
.pill:hover span { border-color: rgba(255,255,255,.28); color: var(--text); }
.pill input:checked + span {
    background: rgba(255,92,122,.16); border-color: rgba(255,92,122,.6); color: #ffd0d9;
}
.pill input:focus-visible + span { outline: 2px solid var(--accent2); outline-offset: 2px; }
.tool-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.field { display: flex; align-items: center; gap: 6px; font-size: .82em; color: var(--muted); }
.field .ctl { height: 30px; font-size: .9em; padding: 0 8px; border-radius: 8px; }
.search { position: relative; margin-left: auto; flex: 1 1 220px; max-width: 340px; }
.search input { width: 100%; height: 34px; padding: 0 34px 0 36px; border-radius: 10px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--dim); pointer-events: none; }
.search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border: none; border-radius: 6px; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 1em;
}
.search-clear:hover { background: var(--surface3); color: var(--text); }

/* ── Stats ── */
.stats {
    display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px;
    margin-top: 14px;
}
.stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 110px;
}
.stat .k { font-size: .74em; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 5px; }
.stat .v { font-size: 1.25em; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v.gold { color: var(--gold); }
.stat .v.peach { color: #ffb38a; }
#topNInput {
    width: 46px; height: 20px; padding: 0 4px; border-radius: 5px; text-align: center;
    background: var(--surface3); border: 1px solid var(--line2); color: var(--text); font-size: 1em;
}
.stat.status { flex: 1 1 260px; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
.status-text { font-size: .88em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.status-text b { color: var(--text); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(94,230,168,.6); }
.dot.warn { background: var(--warn); }
.dot.load { background: var(--accent2); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }

/* ── Pager ── */
.pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px 0; }
.pager .info { font-size: .9em; color: var(--muted); min-width: 120px; text-align: center; font-variant-numeric: tabular-nums; }
.pager .info b { color: var(--text); }

/* ── Grid ── */
.grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px;
    margin-top: 6px;
}
.card {
    --c: #7aa2ff;
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; transition: transform .2s ease, border-color .2s, box-shadow .2s;
}
.grid.animate .card { animation: fadeUp .35s ease both; }
.grid.animate .card:nth-child(2) { animation-delay: .03s; }
.grid.animate .card:nth-child(3) { animation-delay: .06s; }
.grid.animate .card:nth-child(4) { animation-delay: .09s; }
.grid.animate .card:nth-child(5) { animation-delay: .12s; }
.grid.animate .card:nth-child(n+6) { animation-delay: .15s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--c) 55%, transparent);
    box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent);
}
.poster {
    position: relative; display: block; aspect-ratio: 2 / 2.85; overflow: hidden;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 35%, #1a1f2d), #11141d);
}
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
.card:hover .poster img { transform: scale(1.04); }
.poster::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 26%, transparent 62%, rgba(0,0,0,.82) 100%);
}
.rank {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    min-width: 38px; height: 38px; padding: 0 8px; border-radius: 11px;
    display: grid; place-items: center; font-weight: 800; font-size: 1.05em;
    background: rgba(13,16,24,.82); border: 1px solid var(--line2); color: var(--text);
    backdrop-filter: blur(6px);
}
.rank.r1 { background: linear-gradient(135deg, #ffe082, #f5b82e); color: #2a1d00; border-color: #ffe9a8; box-shadow: 0 4px 16px rgba(245,184,46,.5); }
.rank.r2 { background: linear-gradient(135deg, #f1f4f9, #b9c2d0); color: #1c2230; border-color: #fff; }
.rank.r3 { background: linear-gradient(135deg, #f0b27a, #c9773d); color: #2b1504; border-color: #f7c79c; }
.avg-pill {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    height: 32px; padding: 0 10px; border-radius: 10px;
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(13,16,24,.85); border: 1px solid var(--line2);
    font-weight: 800; font-size: 1em; color: var(--sc, var(--gold));
    font-variant-numeric: tabular-nums; backdrop-filter: blur(6px);
}
.avg-pill svg { width: 13px; height: 13px; }
.poster-tags {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 5px;
}
.tag {
    font-size: .72em; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    background: rgba(13,16,24,.78); border: 1px solid rgba(255,255,255,.16); color: #e2e7f2;
    backdrop-filter: blur(4px);
}
.tag.live { color: #8ff0c4; border-color: rgba(94,230,168,.45); }
.body { padding: 12px 13px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.title {
    margin: 0; font-size: 1em; font-weight: 600; line-height: 1.25;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    min-height: 2.5em;
}
.meta { margin: -3px 0 0; font-size: .76em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; font-size: .8em; }
.src .lbl { color: var(--muted); font-weight: 600; font-size: .9em; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--bc, var(--accent2)); transition: width .4s ease; }
.src .val { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.val.na { color: var(--dim); font-weight: 500; }
.val.pending { color: var(--dim); }
.val.pending::after { content: "···"; animation: blink 1s infinite; }
.editable { cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,.3); }
.editable:hover { color: #ffd0d9; border-color: var(--accent); }
.manual-mark { color: #ffb38a; font-size: .85em; margin-left: 2px; }
.edit-input {
    width: 58px; height: 22px; padding: 0 4px; text-align: center; border-radius: 5px;
    background: var(--surface3); border: 1px solid var(--accent); color: var(--text); font-size: .95em;
}
.foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; font-size: .78em; }
.members { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.members svg { width: 13px; height: 13px; }
.links { display: flex; gap: 6px; }
.links a {
    color: #c8d6ff; text-decoration: none; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    background: rgba(122,162,255,.1); border: 1px solid rgba(122,162,255,.25); transition: background .15s;
}
.links a:hover { background: rgba(122,162,255,.22); color: #fff; }

/* Skeleton */
.skel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.skel .p { aspect-ratio: 2 / 2.85; }
.skel .l { height: 12px; margin: 12px 13px 0; border-radius: 6px; }
.skel .l.s { width: 55%; }
.skel .l.last { margin-bottom: 14px; }
.skel .p, .skel .l {
    background: linear-gradient(90deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 100%);
    background-size: 200% 100%; animation: shimmer 1.3s linear infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Empty / error */
.empty {
    text-align: center; padding: 60px 20px; color: var(--muted);
    border: 1px dashed var(--line2); border-radius: var(--radius); margin-top: 20px;
}
.empty h2 { color: var(--text); font-weight: 600; font-size: 1.2em; margin: 0 0 6px; }
.empty p { margin: 0 0 16px; }

.rate-notice {
    margin-top: 12px; padding: 10px 14px; border-radius: 12px; font-size: .88em;
    background: rgba(255,184,107,.1); border: 1px solid rgba(255,184,107,.35); color: #ffe2c2;
    display: flex; align-items: center; gap: 8px;
}
.rate-notice b { color: #fff; }

footer { text-align: center; color: var(--dim); font-size: .78em; padding: 10px 0 30px; }
footer kbd { background: var(--surface2); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 5px; font-family: inherit; color: var(--muted); }

@media (max-width: 1250px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 980px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 680px) {
    .topbar-inner, .wrap { padding-left: 12px; padding-right: 12px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .brand p { display: none; }
    .season-picker { width: 100%; flex-wrap: nowrap; gap: 5px; }
    .season-picker select.ctl { flex: 1 1 0; min-width: 0; padding: 0 6px; }
    .season-picker .btn.primary { padding: 0 12px; }
    .search { max-width: none; margin-left: 0; flex-basis: 100%; }
    .title { font-size: .9em; }
    .body { padding: 10px; gap: 7px; }
    .src { grid-template-columns: 26px 1fr auto; gap: 6px; font-size: .75em; }
    .avg-pill { height: 28px; font-size: .88em; padding: 0 7px; }
    .rank { min-width: 32px; height: 32px; font-size: .92em; }
    .meta { display: none; }
    .foot .members { display: none; }
    .stat { min-width: 0; flex: 1 1 40%; padding: 7px 10px; }
    .stat.status { flex-basis: 100%; }
    footer .kb { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <div class="logo">★</div>
            <div>
                <h1>Ranking de anime por temporada</h1>
                <p>Promedio MyAnimeList + AniList</p>
            </div>
        </div>
        <div class="season-picker">
            <button class="btn icon" id="prevSeasonBtn" title="Temporada anterior">‹</button>
            <select class="ctl" id="season">
                <option value="winter">Winter</option>
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
                <option value="fall">Fall</option>
            </select>
            <select class="ctl" id="year"></select>
            <button class="btn icon" id="nextSeasonBtn" title="Temporada siguiente">›</button>
            <button class="btn primary" id="loadBtn">Cargar</button>
            <button class="btn icon" id="refreshBtn" title="Actualizar ignorando la caché">↻</button>
        </div>
    </div>
    <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
</header>

<div class="wrap">
    <section class="toolbar">
        <div class="pills" id="typePills"></div>
        <div class="tool-group">
            <label class="field">Orden
                <select class="ctl" id="sortSel">
                    <option value="avg">Promedio</option>
                    <option value="mal">MAL</option>
                    <option value="al">AniList</option>
                    <option value="pop">Popularidad</option>
                </select>
            </label>
            <label class="field">Popularidad mín.
                <select class="ctl" id="minPopSel">
                    <option value="0">Todas</option>
                    <option value="1000">1k+</option>
                    <option value="5000">5k+</option>
                    <option value="10000">10k+</option>
                    <option value="25000">25k+</option>
                    <option value="50000">50k+</option>
                    <option value="100000">100k+</option>
                </select>
            </label>
            <label class="field">Puntajes
                <select class="ctl" id="scoreMode">
                    <option value="normal">1–10</option>
                    <option value="percent">%</option>
                </select>
            </label>
            <label class="field">Títulos
                <select class="ctl" id="langSel">
                    <option value="en">Inglés</option>
                    <option value="romaji">Romaji</option>
                </select>
            </label>
            <label class="field">Por página
                <select class="ctl" id="perPageSel">
                    <option>10</option><option>20</option><option>30</option><option>50</option>
                </select>
            </label>
            <label class="pill" title="Mostrar solo animes con puntaje en MAL y en AniList">
                <input type="checkbox" id="bothChk"><span>Solo con ambos puntajes</span>
            </label>
        </div>
        <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="ctl" type="text" id="searchInput" placeholder="Filtrar por nombre…" autocomplete="off">
            <button class="search-clear" id="searchClear" hidden title="Limpiar">✕</button>
        </div>
    </section>

    <section class="stats" id="stats" hidden>
        <div class="stat"><span class="k">Animes</span><span class="v" id="sCount">0</span></div>
        <div class="stat"><span class="k">Prom. Top 10</span><span class="v gold" id="sTop10">--</span></div>
        <div class="stat"><span class="k">Prom. total</span><span class="v" id="sTotal">--</span></div>
        <div class="stat"><span class="k">Prom. Top <input id="topNInput" type="number" min="1" value="10"></span><span class="v peach" id="sTopN">--</span></div>
        <div class="stat status">
            <span class="status-text" id="statusText"></span>
            <button class="btn small" id="retryMalBtn" hidden>Reintentar MAL</button>
        </div>
    </section>

    <nav class="pager" id="pagerTop" hidden>
        <button class="btn small" data-page="prev">← Anterior</button>
        <span class="info"></span>
        <button class="btn small" data-page="next">Siguiente →</button>
    </nav>

    <div class="rate-notice" id="rateNotice" hidden></div>

    <main>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty">
            <h2>Elegí una temporada</h2>
            <p>Seleccioná año y temporada y tocá <b>Cargar</b>.</p>
        </div>
    </main>

    <nav class="pager" id="pagerBottom" hidden>
        <button class="btn small" data-page="prev">← Anterior</button>
        <span class="info"></span>
        <button class="btn small" data-page="next">Siguiente →</button>
    </nav>

    <footer><span class="kb"><kbd>←</kbd> <kbd>→</kbd> cambiar página · <kbd>/</kbd> buscar · </span>Datos: Jikan (MyAnimeList) y AniList</footer>
</div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
// Utilidades
// ════════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const store = {
    get(k, def = null) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch {} },
    keys() { try { return Object.keys(localStorage); } catch { return []; } }
};

function abortError() { const e = new Error('Aborted'); e.name = 'AbortError'; return e; }
function throwIfAborted(signal) { if (signal?.aborted) throw abortError(); }

// fetch con timeout + cancelación (Jikan a veces cuelga la conexión indefinidamente)
async function fetchT(url, { signal, timeout = 12000, ...opts } = {}) {
    const ctl = new AbortController();
    const onAbort = () => ctl.abort();
    if (signal) {
        if (signal.aborted) throw abortError();
        signal.addEventListener('abort', onAbort, { once: true });
    }
    const timer = setTimeout(() => ctl.abort(), timeout);
    try {
        return await fetch(url, { ...opts, signal: ctl.signal });
    } catch (e) {
        if (signal?.aborted) throw abortError();
        throw e;
    } finally {
        clearTimeout(timer);
        signal?.removeEventListener('abort', onAbort);
    }
}

function seasonTTL(y, s) {

function readSeasonCache(y, s) {

    if (!c || !Array.isArray(c.items)) return null;
    if (Date.now() - c.t > seasonTTL(y, s)) { store.del(seasonKey(y, s)); return null; }
    return c;
}
function pruneByTime(prefix, max) {
    const entries = store.keys().filter(k => k.startsWith(prefix)).map(k => ({ k, t: store.get(k)?.t || 0 }));
    if (entries.length <= max) return;
    entries.sort((a, b) => a.t - b.t).slice(0, entries.length - max).forEach(e => store.del(e.k));
}
function writeSeasonCache(y, s, items, complete, t = Date.now()) {
    const payload = { t, complete, items };
    if (!store.set(seasonKey(y, s), payload)) {
        pruneByTime(SEASON_PREFIX, 8);
        pruneByTime(MAL_PREFIX, 100);
        store.set(seasonKey(y, s), payload);
    }
    pruneByTime(SEASON_PREFIX, MAX_SEASONS);
}

}

// ════════════════════════════════════════════════════════════════
// Jikan: limitador global de requests
//   Límite oficial: 3 req/s y 60 req/min. Antes cada 429 disparaba
//   reintentos sin pausa global (y fetchMalById reintentaba infinito).
//   Ahora todas las requests pasan por una cola con espaciado fijo,
//   tope por minuto, pausa global ante 429 y timeout por request.
// ════════════════════════════════════════════════════════════════
const Jikan = (() => {
    const BASE = 'https://api.jikan.moe/v4';
    const GAP = 420;        // ≈ 2.4 req/s
    const PER_MIN = 55;
    let chain = Promise.resolve();
    let last = 0, cooldownUntil = 0;
    const log = [];

    function slot(signal) {
        const p = chain.then(async () => {
            for (;;) {
                if (signal?.aborted) return;          // las requests canceladas no ocupan turno
                const now = Date.now();
                while (log.length && now - log[0] > 60000) log.shift();
                let wait = Math.max(last + GAP - now, cooldownUntil - now, 0);
                if (log.length >= PER_MIN) wait = Math.max(wait, log[0] + 60000 - now + 50);
                if (wait <= 0) break;
                await sleep(Math.min(wait, 1000));    // re-chequea cancelación cada segundo
            }
            last = Date.now();
            log.push(last);
        });
        chain = p.catch(() => {});
        return p;
    }

    async function get(path, { signal, retries = 3, timeout = 12000 } = {}) {
        for (let attempt = 0; ; attempt++) {
            await slot(signal);
            throwIfAborted(signal);
            let res;
            try {
                res = await fetchT(BASE + path, { signal, timeout });
            } catch (e) {
                if (e.name === 'AbortError' && signal?.aborted) throw e;
                if (attempt >= retries) throw e;
                cooldownUntil = Math.max(cooldownUntil, Date.now() + 800 * (attempt + 1));
                continue;
            }
            if (res.status === 404) return null;
            if (res.status === 429 || res.status >= 500) {
                if (attempt >= retries) throw new Error('Jikan ' + res.status);
                const ra = parseFloat(res.headers.get('Retry-After'));
                const wait = !isNaN(ra) ? ra * 1000 : 1200 * 2 ** attempt;
                cooldownUntil = Math.max(cooldownUntil, Date.now() + wait);   // pausa global
                continue;
            }
            if (!res.ok) throw new Error('Jikan ' + res.status);
            return res.json();
        }
    }
    return { get };
})();

// ════════════════════════════════════════════════════════════════
// AniList
// ════════════════════════════════════════════════════════════════
const AL_QUERY = `query ($y: Int, $s: MediaSeason, $p: Int, $f: [MediaFormat]) {
  Page(page: $p, perPage: 50) {
    pageInfo { hasNextPage lastPage }
    media(seasonYear: $y, season: $s, type: ANIME, isAdult: false, format_in: $f, sort: POPULARITY_DESC) {
      id idMal
      title { english romaji native }
      averageScore popularity format episodes status genres
      coverImage { extraLarge large color }
      studios(isMain: true) { nodes { name } }
    }
  }
}`;

// ── Limitador global de AniList ─────────────────────────────────
//   AniList permite ~30 req/min (modo degradado) y bloquea ~1 min al pasarse.
//   Además sus respuestas 429 no traen CORS → el navegador ve un error de red.
//   Por eso: cola secuencial, tope por minuto, y ante un 429 (o error de red)
//   pausa global de 60 s que sobrevive a recargar la página.
const AniLimiter = (() => {
    const GAP = 800;          // separación mínima entre requests
    const PER_MIN = 24;       // margen debajo del límite real (30/min)
    const LOG_KEY = 'AR2_al_log', COOL_KEY = 'AR2_al_cool';
    let chain = Promise.resolve();
    let last = 0;
    let log = (store.get(LOG_KEY) || []).filter(t => Date.now() - t < 60000);
    let cooldownUntil = store.get(COOL_KEY) || 0;

    function slot(signal) {
        const p = chain.then(async () => {
            for (;;) {
                if (signal?.aborted) { rateNotice(0); return; }
                const now = Date.now();
                log = log.filter(t => now - t < 60000);
                let wait = Math.max(last + GAP - now, cooldownUntil - now, 0);
                if (log.length >= PER_MIN) wait = Math.max(wait, log[0] + 60000 - now + 100);
                if (wait <= 0) break;
                if (wait > 1500) rateNotice(Math.ceil(wait / 1000));
                await sleep(Math.min(wait, 1000));
            }
            rateNotice(0);
            last = Date.now();
            log.push(last);
            store.set(LOG_KEY, log);
        });
        chain = p.catch(() => {});
        return p;
    }
    function penalize(ms) {
        cooldownUntil = Math.max(cooldownUntil, Date.now() + ms);
        store.set(COOL_KEY, cooldownUntil);
    }
    function sync(res) {
        // Si AniList expone los headers de rate limit, los respetamos
        const rem = parseInt(res.headers.get('X-RateLimit-Remaining'));
        const reset = parseInt(res.headers.get('X-RateLimit-Reset'));
        if (!isNaN(rem) && rem <= 2) penalize(!isNaN(reset) ? Math.max(0, reset * 1000 - Date.now()) + 500 : 30000);
    }
    return { slot, penalize, sync };
})();

function rateNotice(sec) {
    const el = $('#rateNotice');
    if (!el) return;
    if (sec > 0) {
        el.hidden = false;
        el.innerHTML = `<span class="dot warn"></span>Límite de consultas de AniList alcanzado — reanudando en <b>${sec} s</b>. Las temporadas ya cargadas se ven al instante desde la caché.`;
    } else el.hidden = true;
}

async function alRequest(vars, signal) {
    for (let attempt = 0; ; attempt++) {
        await AniLimiter.slot(signal);
        throwIfAborted(signal);
        let res;
        try {
            res = await fetchT('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ query: AL_QUERY, variables: vars }),
                signal, timeout: 15000
            });
        } catch (e) {
            if (signal?.aborted) throw e;
            // Casi siempre es un 429 disfrazado por CORS → pausa larga
            AniLimiter.penalize(60000);
            if (attempt >= 1) throw new Error('AniList no responde (posible límite de consultas)');
            continue;
        }
        AniLimiter.sync(res);
        if (res.status === 429) {
            AniLimiter.penalize(60000);
            if (attempt >= 1) throw new Error('AniList 429 (límite de consultas)');
            continue;
        }
        if (res.status >= 500) {
            AniLimiter.penalize(3000 * (attempt + 1));
            if (attempt >= 2) throw new Error('AniList ' + res.status);
            continue;
        }
        if (!res.ok) throw new Error('AniList ' + res.status);
        const j = await res.json();
        if (!j.data?.Page) throw new Error(j.errors?.[0]?.message || 'AniList sin datos');
        return j.data.Page;
    }
}

const AL_FORMATS = ['TV', 'TV_SHORT', 'ONA', 'MOVIE', 'OVA', 'SPECIAL'];
const AL_MAX_PAGES = 6;   // 300 más populares: el resto casi nunca tiene puntaje

async function fetchAniList(year, season, signal) {
    const vars = { y: year, s: season.toUpperCase(), f: AL_FORMATS };
    const media = [];
    // Secuencial a propósito: ráfagas en paralelo disparan el 429
    for (let p = 1; p <= AL_MAX_PAGES; p++) {
        const page = await alRequest({ ...vars, p }, signal);
        media.push(...page.media);
        setProgress(8 + 20 * p / Math.min(page.pageInfo.lastPage || p, AL_MAX_PAGES));
        if (!page.pageInfo.hasNextPage) break;
        // Página casi sin puntajes → lo que sigue es todavía menos popular, cortamos
        if (p >= 2 && page.media.filter(m => m.averageScore).length < 5) break;
    }

    const seen = new Set();
    return media.filter(m => m && !seen.has(m.id) && seen.add(m.id)).map(m => ({
        al_id: m.id,
        mal_id: m.idMal || null,
        en: m.title?.english || null,
        ro: m.title?.romaji || null,
        na: m.title?.native || null,
        img: m.coverImage?.extraLarge || m.coverImage?.large || '',
        color: m.coverImage?.color || null,
        format: m.format,
        eps: m.episodes || null,
        al: m.averageScore ? m.averageScore / 10 : null,
        pop: m.popularity || 0,
        genres: (m.genres || []).slice(0, 3),
        studio: m.studios?.nodes?.[0]?.name || null,
        status: m.status,
        mal: null
    }));
}

// ════════════════════════════════════════════════════════════════
// MAL — dos fuentes:
//   1) API oficial de MAL vía proxy propio (Cloudflare Worker) → 1 request por temporada
//   2) Jikan (no oficial, inestable desde ago-2026) → fallback, falla rápido
// Devuelve { ok, down, source }
// ════════════════════════════════════════════════════════════════
// Proxy propio (Cloudflare Worker) hacia la API oficial de MAL
const MAL_PROXY = 'https://mal-proxy.16bppcsxa.workers.dev';

const MAL_FIELDS = 'mean,num_list_users,num_episodes,alternative_titles';
const slimOfficial = n => ({
    score: n.mean ?? null,
    members: n.num_list_users ?? null,
    eps: n.num_episodes || null,
    t: n.title ?? null,
    te: n.alternative_titles?.en || null
});

async function malOfficialGet(path, signal) {
    const base = MAL_PROXY;
    for (let attempt = 0; ; attempt++) {
        let res;
        try {
            res = await fetchT(base + path, { signal, timeout: 15000 });
        } catch (e) {
            if (signal?.aborted) throw e;
            if (attempt >= 1) throw e;
            await sleep(800);
            continue;
        }
        if (res.status === 404) return null;
        if (res.status === 429 || res.status >= 500) {
            if (attempt >= 2) throw new Error('MAL ' + res.status);
            await sleep(1500 * (attempt + 1));
            throwIfAborted(signal);
            continue;
        }
        if (!res.ok) throw new Error('MAL ' + res.status);
        return res.json();
    }
}

// Ejecuta tareas con concurrencia limitada
async function pool(list, n, fn) {
    let i = 0;
    const workers = Array.from({ length: Math.min(n, list.length) }, async () => {
        while (i < list.length) await fn(list[i++]);
    });
    await Promise.all(workers);
}

// Jikan caído recientemente → no lo volvemos a esperar en cada temporada
let jikanDownUntil = 0;

async function seasonFromOfficial(byId, apply, year, season, { signal, onUpdate, onProgress }) {
    let path = `/v2/anime/season/${year}/${season}?limit=500&nsfw=true&fields=${MAL_FIELDS}`;
    let page = 0;
    while (path && page < 4) {
        const j = await malOfficialGet(path, signal);
        (j?.data || []).forEach(({ node }) => byId.has(node.id) && apply(node.id, slimOfficial(node)));
        page++;
        onProgress(30 + 40 * Math.min(page, 2) / 2, 'MAL: temporada recibida');
        onUpdate();
        const next = j?.paging?.next;
        path = next ? next.replace(/^https?:\/\/api\.myanimelist\.net/, '') : null;
    }
}

async function seasonFromJikan(byId, apply, year, season, { signal, onUpdate, onProgress }) {
    let ok = true, pagesDone = 0, totalPages = 1;
    const handlePage = json => {
        (json?.data || []).forEach(a => byId.has(a.mal_id) && apply(a.mal_id, slimMal(a)));
        pagesDone++;
        onProgress(30 + 45 * pagesDone / totalPages, `MAL (Jikan): página ${pagesDone}/${totalPages}`);
        onUpdate();
    };
    // Primera página: timeout corto y sin reintentos → si Jikan está caído nos enteramos en segundos
    const first = await Jikan.get(`/seasons/${year}/${season}?page=1`, { signal, retries: 0, timeout: 8000 });
    totalPages = Math.min(first?.pagination?.last_visible_page || 1, 15);
    handlePage(first);
    const jobs = [];
    for (let p = 2; p <= totalPages; p++) {
        jobs.push(Jikan.get(`/seasons/${year}/${season}?page=${p}`, { signal, retries: 2, timeout: 10000 })
            .then(handlePage)
            .catch(e => { if (signal.aborted) throw e; ok = false; }));
    }
    await Promise.all(jobs);
    return ok;
}

async function fetchMal(items, year, season, { signal, onUpdate, onProgress, forceJikan = false }) {
    const byId = new Map();
    items.forEach(it => {
        if (!it.mal_id) return;
        if (!byId.has(it.mal_id)) byId.set(it.mal_id, []);
        byId.get(it.mal_id).push(it);
    });
    if (!byId.size) return { ok: true, down: false, source: null };

    const apply = (id, d) => byId.get(id)?.forEach(it => { it.mal = d; });
    const opts = { signal, onUpdate, onProgress };
    let ok = true, source = null;

    // 1) Listado de la temporada
    if (MAL_PROXY) {
        try {
            await seasonFromOfficial(byId, apply, year, season, opts);
            source = 'official';
        } catch (e) {
            if (signal.aborted) throw e;
            console.warn('MAL oficial (proxy) falló, probando Jikan:', e);
        }
    }
    if (!source && (forceJikan || Date.now() > jikanDownUntil)) {
        try {
            ok = await seasonFromJikan(byId, apply, year, season, opts);
            source = 'jikan';
        } catch (e) {
            if (signal.aborted) throw e;
            console.warn('Jikan no responde:', e);
            jikanDownUntil = Date.now() + 10 * MIN;
        }
    }

    // 2) Faltantes (AniList y MAL a veces ubican el anime en temporadas distintas)
    const toFetch = [];
    for (const [id, arr] of byId) {
        if (arr[0].mal) continue;
        const c = readMalCache(id);
        if (c) apply(id, c); else toFetch.push(id);
    }
    onUpdate();
    if (!source) return { ok: false, down: true, source: null };   // ninguna fuente responde

    toFetch.sort((a, b) => byId.get(b)[0].pop - byId.get(a)[0].pop);   // los más populares primero
    const LIMIT = source === 'official' ? 120 : 60;
    const batch = toFetch.slice(0, LIMIT);
    if (toFetch.length > LIMIT) ok = false;
    let done = 0;
    const getOne = source === 'official'
        ? async id => { const n = await malOfficialGet(`/v2/anime/${id}?fields=${MAL_FIELDS}`, signal); return n ? slimOfficial(n) : null; }
        : async id => { const j = await Jikan.get(`/anime/${id}`, { signal, retries: 2, timeout: 10000 }); return j?.data ? slimMal(j.data) : null; };

    await pool(batch, source === 'official' ? 4 : 3, async id => {
        try {
            const d = (await getOne(id)) || { score: null, members: null };
            apply(id, d);
            writeMalCache(id, d);
        } catch (e) {
            if (signal.aborted) throw e;
            ok = false;
        } finally {
            done++;
            if (!signal.aborted) { onProgress(75 + 25 * done / batch.length, `MAL: faltantes ${done}/${batch.length}`); onUpdate(); }
        }
    });
    return { ok, down: false, source };
}

const state = {

    items: [],
    malState: 'idle',       // idle | loading | done | partial | down
    malSource: null,        // official | jikan
    fromCache: null,        // timestamp si vino de caché
    ranking: [],
    loaded: false
};
let currentPage = 1;
let searchQuery = '';
let loadSeq = 0;
let abortCtl = null;

// ════════════════════════════════════════════════════════════════
// Ranking
// ════════════════════════════════════════════════════════════════
function displayTitle(it) {
    const m = it.mal || {};
    const list = prefs.lang === 'romaji'
        ? [m.t, it.ro, it.en, m.te, it.na]
        : [m.te, it.en, m.t, it.ro, it.na];
    return (list.find(x => x && String(x).trim()) || 'Sin título').trim();
}

function buildRanking() {
    const types = new Set(prefs.types);
    const out = [];
    for (const it of state.items) {
        if (!types.has(it.format)) continue;
        const malS = it.mal?.score ?? null;
        let alS = it.al, manual = false;
        if (alS == null) { const m = getManual(it); if (m != null) { alS = m; manual = true; } }
        if (malS == null && alS == null) continue;
        if (prefs.both && (malS == null || alS == null)) continue;
        const members = it.mal?.members ?? null;
        const popVal = members ?? it.pop ?? 0;
        if (prefs.minPop && popVal < prefs.minPop) continue;
        const vals = [malS, alS].filter(v => v != null);
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        out.push({ it, malS, alS, manual, avg, members, popVal, title: displayTitle(it) });
    }
    const key = {
        avg: r => r.avg,
        mal: r => r.malS ?? -1,
        al:  r => r.alS ?? -1,
        pop: r => r.popVal
    }[prefs.sort] || (r => r.avg);
    out.sort((a, b) =>
        (key(b) - key(a)) ||
        (Math.max(b.malS ?? 0, b.alS ?? 0) - Math.max(a.malS ?? 0, a.alS ?? 0)) ||
        a.title.localeCompare(b.title));
    out.forEach((r, i) => { r.rank = i + 1; });
    state.ranking = out;
}

function getView() {
    if (!searchQuery) return state.ranking;
    const q = searchQuery.toLowerCase();
    return state.ranking.filter(r => {
        const it = r.it;
        return [r.title, it.en, it.ro, it.na, it.mal?.t, it.mal?.te].some(t => t && t.toLowerCase().includes(q));
    });
}

const grid = $('#grid');
const emptyEl = $('#empty');

const fmt = n => n == null ? 'N/A' : prefs.scoreMode === 'percent' ? (n * 10).toFixed(1) + '%' : n.toFixed(2);
const fmtNum = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
function scoreColor(s) {
    if (s == null) return '#7c869e';
    if (s >= 8.5) return '#5ee6a8';
    if (s >= 8)   return '#a6e87e';
    if (s >= 7.5) return '#ffe07a';
    if (s >= 7)   return '#ffbf75';
    if (s >= 6)   return '#ff9f8a';
    return '#ff8fa3';
}

const ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const ICON_USERS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>';

function srcRow(label, val, opts = {}) {
    const width = val != null ? Math.max(0, Math.min(100, val * 10)) : 0;
    let valHTML;
    if (opts.pending) valHTML = '<span class="val pending"></span>';
    else if (val == null) valHTML = opts.editable
        ? `<span class="val na editable" data-edit="${opts.idx}" title="Agregar puntaje manual">N/A ✎</span>`
        : '<span class="val na">N/A</span>';
    else valHTML = `<span class="val${opts.editable ? ' editable' : ''}" ${opts.editable ? `data-edit="${opts.idx}" title="Puntaje manual — click para editar"` : ''} style="color:${scoreColor(val)}">${fmt(val)}${opts.manual ? '<span class="manual-mark">✎</span>' : ''}</span>`;
    return `<div class="src"><span class="lbl">${label}</span><div class="bar"><i style="width:${width}%;--bc:${scoreColor(val)}"></i></div>${valHTML}</div>`;
}

function cardHTML(r, idx) {
    const it = r.it;
    const rankCls = r.rank <= 3 ? ` r${r.rank}` : '';
    const eps = it.mal?.eps || it.eps;
    const malUrl = it.mal_id ? `https://myanimelist.net/anime/${it.mal_id}` : null;
    const alUrl = `https://anilist.co/anime/${it.al_id}`;
    const malPending = it.mal_id && !it.mal && state.malState === 'loading';
    const meta = [it.studio, ...(it.genres || []).slice(0, 2)].filter(Boolean).join(' · ');
    const membersLabel = r.members != null
        ? `<span class="members" title="Miembros en MAL">${ICON_USERS}${fmtNum(r.members)}</span>`
        : it.pop ? `<span class="members" title="Usuarios en AniList">${ICON_USERS}${fmtNum(it.pop)}</span>` : '<span></span>';

    return `
<article class="card" style="--c:${esc(it.color || '#7aa2ff')}">
  <a class="poster" href="${malUrl || alUrl}" target="_blank" rel="noopener">
    ${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}
    <span class="rank${rankCls}">${r.rank}</span>
    <span class="avg-pill" style="--sc:${scoreColor(r.avg)}">${ICON_STAR}${fmt(r.avg)}</span>
    <div class="poster-tags">
      ${it.format ? `<span class="tag">${esc(TYPE_LABEL[it.format] || it.format)}</span>` : ''}
      ${eps ? `<span class="tag">${eps} ep</span>` : ''}
      ${it.status === 'RELEASING' ? '<span class="tag live">● En emisión</span>' : ''}
    </div>
  </a>
  <div class="body">
    <h3 class="title" title="${esc(r.title)}">${esc(r.title)}</h3>
    ${meta ? `<p class="meta">${esc(meta)}</p>` : ''}
    ${srcRow('MAL', r.malS, { pending: malPending })}
    ${srcRow('AL', r.alS, { editable: it.al == null, manual: r.manual, idx })}
    <div class="foot">
      ${membersLabel}
      <span class="links">
        ${malUrl ? `<a href="${malUrl}" target="_blank" rel="noopener">MAL</a>` : ''}
        <a href="${alUrl}" target="_blank" rel="noopener">AniList</a>
      </span>
    </div>
  </div>
</article>`;
}

let pageSlice = [];
function renderGrid(animate = false) {
    const view = getView();
    const pp = prefs.perPage;
    const pages = Math.max(1, Math.ceil(view.length / pp));
    if (currentPage > pages) currentPage = pages;
    if (currentPage < 1) currentPage = 1;
    pageSlice = view.slice((currentPage - 1) * pp, currentPage * pp);

    grid.classList.toggle('animate', animate);
    grid.innerHTML = pageSlice.map(cardHTML).join('');

    if (!state.loaded) return;
    if (!view.length) {
        emptyEl.hidden = false;
        emptyEl.innerHTML = searchQuery
            ? `<h2>Sin resultados</h2><p>No hay animes que coincidan con “${esc(searchQuery)}”.</p>`
            : state.malState === 'loading'
                ? '<h2>Cargando puntajes…</h2><p>Esperando datos de MyAnimeList.</p>'
                : '<h2>No hay animes con estos filtros</h2><p>Probá habilitar más tipos o bajar la popularidad mínima.</p>';
    } else emptyEl.hidden = true;

    ['#pagerTop', '#pagerBottom'].forEach(sel => {
        const el = $(sel);
        el.hidden = view.length <= pp;
        el.querySelector('.info').innerHTML = `Página <b>${currentPage}</b> de <b>${pages}</b>`;
        el.querySelector('[data-page=prev]').disabled = currentPage <= 1;
        el.querySelector('[data-page=next]').disabled = currentPage >= pages;
    });
}

function renderSkeletons() {
    emptyEl.hidden = true;
    $('#pagerTop').hidden = $('#pagerBottom').hidden = true;
    grid.classList.remove('animate');
    grid.innerHTML = Array.from({ length: prefs.perPage }, () =>
        '<div class="skel"><div class="p"></div><div class="l"></div><div class="l s"></div><div class="l last"></div></div>').join('');
}

function avgOf(arr) { return arr.length ? arr.reduce((a, r) => a + r.avg, 0) / arr.length : null; }

function renderStats() {
    const R = state.ranking;
    $('#stats').hidden = !state.loaded;
    $('#sCount').textContent = R.length;
    $('#sTop10').textContent = fmt(avgOf(R.slice(0, 10)));
    $('#sTotal').textContent = fmt(avgOf(R));
    const inp = $('#topNInput');
    let n = parseInt(inp.value) || prefs.topN || 10;
    n = Math.max(1, Math.min(n, Math.max(R.length, 1)));
    if (document.activeElement !== inp) inp.value = n;
    inp.max = Math.max(R.length, 1);
    $('#sTopN').textContent = fmt(avgOf(R.slice(0, n)));
    renderStatus();
}

let malProgress = '';
function renderStatus() {
    const el = $('#statusText');
    const retry = $('#retryMalBtn');
    const label = `<b>${SEASON_NAME[state.season] || ''} ${state.year || ''}</b>`;
    const cacheInfo = state.fromCache ? ` · caché de hace ${timeAgo(state.fromCache)}` : '';
    const missing = state.items.filter(it => it.mal_id && !it.mal).length;
    const srcInfo = state.malSource === 'official' ? ' (oficial)' : state.malSource === 'jikan' ? ' (Jikan)' : '';
    retry.hidden = true;
    switch (state.malState) {
        case 'loading':
            el.innerHTML = `<span class="dot load"></span>${label} · AniList listo · ${esc(malProgress || 'cargando MAL…')}`;
            break;
        case 'done':
            el.innerHTML = `<span class="dot ok"></span>${label} · MAL${srcInfo} + AniList${cacheInfo}`;
            break;
        case 'partial':
            el.innerHTML = `<span class="dot warn"></span>${label} · MAL incompleto (${missing} sin datos)${cacheInfo}`;
            retry.hidden = false;
            break;
        case 'down':
            el.innerHTML = `<span class="dot warn"></span>${label} · MAL no responde, mostrando solo AniList${cacheInfo}`;
            retry.hidden = false;
            break;
        default:
            el.innerHTML = label;
    }
}

function timeAgo(t) {
    const m = Math.round((Date.now() - t) / MIN);
    if (m < 1) return 'segundos';
    if (m < 60) return `${m} min`;
    const h = Math.round(m / 60);
    if (h < 48) return `${h} h`;
    return `${Math.round(h / 24)} días`;
}

function refresh({ animate = false, keepPage = true } = {}) {
    buildRanking();
    if (!keepPage) currentPage = 1;
    renderGrid(animate);
    renderStats();
}

// Render "throttled" durante la carga progresiva de MAL
let renderTimer = null;
function scheduleRefresh() {
    if (renderTimer) return;
    renderTimer = setTimeout(() => { renderTimer = null; refresh(); }, 300);
}

const progressEl = $('#progress'), progressFill = $('#progressFill');
let progressHideTimer = null;
function setProgress(pct, msg) {
    clearTimeout(progressHideTimer);
    progressEl.classList.add('active');
    progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
    if (msg != null) { malProgress = msg; renderStatus(); }
    if (pct >= 100) progressHideTimer = setTimeout(() => {
        progressEl.classList.remove('active');
        setTimeout(() => { progressFill.style.width = '0%'; }, 400);
    }, 500);
}

// ════════════════════════════════════════════════════════════════
// Carga
// ════════════════════════════════════════════════════════════════
async function loadSeason({ force = false } = {}) {
    const year = parseInt($('#year').value);
    const season = $('#season').value;
    if (!year || !season) return;

    const seq = ++loadSeq;
    abortCtl?.abort();
    abortCtl = new AbortController();
    const signal = abortCtl.signal;

    Object.assign(state, { year, season, items: [], ranking: [], malState: 'idle', malSource: null, fromCache: null, loaded: false });
    currentPage = 1;
    clearSearch(false);
    malProgress = '';

    const cached = !force && readSeasonCache(year, season);
    if (cached) {
        state.items = cached.items;
        state.fromCache = cached.t;
        state.alT = cached.t;
        state.malState = cached.complete ? 'done' : 'partial';
        state.loaded = true;
        setProgress(100);
        refresh({ animate: true });
        if (!cached.complete) runMal(seq, signal);   // completar lo que faltó la vez anterior
        return;
    }

    renderSkeletons();
    $('#stats').hidden = true;
    setProgress(8);

    try {
        state.items = await fetchAniList(year, season, signal);
    } catch (e) {
        if (seq !== loadSeq) return;
        console.error('AniList', e);
        rateNotice(0);
        setProgress(100);
        grid.innerHTML = '';
        emptyEl.hidden = false;
        emptyEl.innerHTML = `<h2>No se pudo cargar la temporada</h2><p>AniList no respondió (${esc(e.message)}).</p><p>Esperá un minuto antes de reintentar: AniList bloquea temporalmente si recibe muchas consultas seguidas.</p><button class="btn primary" onclick="loadSeason()">Reintentar</button>`;
        return;
    }
    if (seq !== loadSeq) return;

    // Guardamos AniList ya mismo: si cambiás de temporada antes de que termine MAL, no se vuelve a pedir
    state.alT = Date.now();
    writeSeasonCache(year, season, state.items, false, state.alT);

    // Mostramos YA el ranking con AniList; MAL se va sumando a medida que llega
    state.loaded = true;
    state.malState = 'loading';
    setProgress(30, 'cargando MAL…');
    refresh({ animate: true });

    await runMal(seq, signal);
}

// Al navegar rápido con ‹ › solo se carga la temporada donde frenás
let loadDebounce = null;
function loadSeasonDebounced() {
    clearTimeout(loadDebounce);
    loadDebounce = setTimeout(() => loadSeason(), 450);
}

async function runMal(seq, signal, forceJikan = false) {
    const { year, season } = state;
    state.malState = 'loading';
    renderStatus();
    let result;
    try {
        result = await fetchMal(state.items, year, season, {
            signal,
            onUpdate: () => { if (seq === loadSeq) scheduleRefresh(); },
            onProgress: (pct, msg) => { if (seq === loadSeq) setProgress(pct, msg); },
            forceJikan
        });
    } catch (e) {
        if (signal.aborted) return;
        console.error('MAL', e);
        result = { ok: false, down: true, source: null };
    }
    if (seq !== loadSeq) return;

    const missing = state.items.some(it => it.mal_id && !it.mal);
    const complete = result.ok && !missing;
    state.malState = complete ? 'done' : result.down ? 'down' : 'partial';
    state.fromCache = null;
    state.malSource = result.source;
    writeSeasonCache(year, season, state.items, complete, state.alT || Date.now());
    setProgress(100);
    clearTimeout(renderTimer); renderTimer = null;
    refresh();
}

function retryMal() {
    if (!state.loaded || state.malState === 'loading') return;
    abortCtl?.abort();
    abortCtl = new AbortController();
    const seq = ++loadSeq;
    setProgress(30, 'reintentando MAL…');
    runMal(seq, abortCtl.signal, true);
}

// ════════════════════════════════════════════════════════════════
// Edición manual del puntaje AniList
// ════════════════════════════════════════════════════════════════
function editScore(el) {
    const r = pageSlice[+el.dataset.edit];
    if (!r) return;
    const it = r.it;
    const input = document.createElement('input');
    input.type = 'number'; input.step = '0.01'; input.min = '0'; input.max = '10';
    input.className = 'edit-input';
    const cur = getManual(it);
    input.value = cur != null ? cur : '';
    let done = false;
    const commit = save => {
        if (done) return; done = true;
        if (save) {
            const v = parseFloat(input.value);
            if (input.value.trim() === '') store.del(manualKey(it));
            else if (!isNaN(v) && v >= 0 && v <= 10) store.set(manualKey(it), +v.toFixed(2));
        }
        refresh();
    };
    input.addEventListener('blur', () => commit(true));
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') { commit(false); }
        e.stopPropagation();
    });
    el.replaceWith(input);
    input.focus(); input.select();
}

// ════════════════════════════════════════════════════════════════
// Controles
// ════════════════════════════════════════════════════════════════
function clearSearch(rerender = true) {
    searchQuery = '';
    $('#searchInput').value = '';
    $('#searchClear').hidden = true;
    if (rerender) { currentPage = 1; renderGrid(); }
}

function shiftSeason(dir) {
    let y = parseInt($('#year').value);
    let i = SEASONS.indexOf($('#season').value) + dir;
    if (i < 0) { i = 3; y--; }
    if (i > 3) { i = 0; y++; }
    if (![...$('#year').options].some(o => +o.value === y)) return;
    $('#year').value = y;
    $('#season').value = SEASONS[i];
    loadSeasonDebounced();
}

function goPage(dir) {
    const pages = Math.ceil(getView().length / prefs.perPage);
    const next = currentPage + dir;
    if (next < 1 || next > pages) return;
    currentPage = next;
    renderGrid(true);
    if (dir && $('#pagerTop').getBoundingClientRect().top < 0) $('#pagerTop').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function init() {
    // Años
    const yearSel = $('#year');
    const { year, season } = currentSeason();
    for (let y = year + 1; y >= 1990; y--) yearSel.add(new Option(y, y));
    yearSel.value = year;
    $('#season').value = season;

    // Pills de tipo
    $('#typePills').innerHTML = TYPES.map(t =>
        `<label class="pill"><input type="checkbox" value="${t.id}" ${prefs.types.includes(t.id) ? 'checked' : ''}><span>${t.label}</span></label>`).join('');
    $('#typePills').addEventListener('change', () => {
        prefs.types = [...document.querySelectorAll('#typePills input:checked')].map(i => i.value);
        savePrefs(); refresh({ keepPage: false });
    });

    // Selects de preferencias
    const bindSel = (sel, key, parse = v => v) => {
        const el = $(sel);
        el.value = String(prefs[key]);
        el.addEventListener('change', () => { prefs[key] = parse(el.value); savePrefs(); refresh({ keepPage: key === 'scoreMode' || key === 'lang' }); });
    };
    bindSel('#sortSel', 'sort');
    bindSel('#minPopSel', 'minPop', Number);
    bindSel('#scoreMode', 'scoreMode');
    bindSel('#langSel', 'lang');
    bindSel('#perPageSel', 'perPage', Number);
    $('#bothChk').checked = prefs.both;
    $('#bothChk').addEventListener('change', e => { prefs.both = e.target.checked; savePrefs(); refresh({ keepPage: false }); });

    $('#topNInput').value = prefs.topN;
    $('#topNInput').addEventListener('input', e => {
        const n = parseInt(e.target.value);
        if (n > 0) { prefs.topN = n; savePrefs(); }
        renderStats();
    });

    // Temporada
    $('#loadBtn').addEventListener('click', () => loadSeason());
    $('#refreshBtn').addEventListener('click', () => loadSeason({ force: true }));
    $('#prevSeasonBtn').addEventListener('click', () => shiftSeason(-1));
    $('#nextSeasonBtn').addEventListener('click', () => shiftSeason(1));
    $('#season').addEventListener('change', () => state.year && loadSeasonDebounced());
    $('#year').addEventListener('change', () => state.year && loadSeasonDebounced());
    $('#retryMalBtn').addEventListener('click', retryMal);


    // Búsqueda
    $('#searchInput').addEventListener('input', e => {
        searchQuery = e.target.value.trim();
        $('#searchClear').hidden = !searchQuery;
        currentPage = 1;
        renderGrid();
    });
    $('#searchClear').addEventListener('click', () => { clearSearch(); $('#searchInput').focus(); });

    // Paginación
    document.querySelectorAll('.pager').forEach(p => p.addEventListener('click', e => {
        const b = e.target.closest('[data-page]');
        if (b) goPage(b.dataset.page === 'next' ? 1 : -1);
    }));

    // Edición manual (delegación)
    grid.addEventListener('click', e => {
        const el = e.target.closest('[data-edit]');
        if (el) { e.preventDefault(); editScore(el); }
    });

    // Teclado
    document.addEventListener('keydown', e => {
        const tag = e.target.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
            if (e.key === 'Escape' && e.target.id === 'searchInput') { clearSearch(); e.target.blur(); }
            return;
        }
        if (e.key === 'ArrowLeft')  { goPage(-1); e.preventDefault(); }
        if (e.key === 'ArrowRight') { goPage(1);  e.preventDefault(); }
        if (e.key === '/' && state.loaded) { $('#searchInput').focus(); e.preventDefault(); }
    });

    // Swipe en móvil
    let sx = 0, sy = 0;
    grid.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; }, { passive: true });
    grid.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - sx, dy = e.changedTouches[0].screenY - sy;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goPage(dx < 0 ? 1 : -1);
    }, { passive: true });
}

init();
</script>
</body>
</html>
